<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Native Messaging Echo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Native Messaging Echo</h1>

    <label for="input">Input</label>
    <textarea id="input" rows="6" placeholder="Type a message here...">Hello from Chrome</textarea>

    <button id="send" type="button">Send to native host</button>

    <label for="output">Output</label>
    <pre id="output">No response yet.</pre>
  </main>

  <script src="popup.js"></script>
</body>
</html>
